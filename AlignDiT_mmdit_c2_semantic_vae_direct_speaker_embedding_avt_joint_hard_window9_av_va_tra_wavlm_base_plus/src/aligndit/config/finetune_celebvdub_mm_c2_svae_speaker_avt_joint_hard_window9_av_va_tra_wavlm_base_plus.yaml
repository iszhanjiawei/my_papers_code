model:
  name: AlignDiT_MMDiT_c2_svae_speaker_avt_joint_hard_window9_av_va_tra_wavlm_base_plus_ctc003_warmup10k30k
  # Retain the donor coefficient and tap; only the per-sample time weight changes.
  # Here x_t=(1-t)*noise+t*clean, so TARO Eq.(7) becomes t/(1+eps).
  repa_lambda: 0.1
  repa_schedule: taro_clean_fraction
  repa_schedule_eps: 1.0e-8
  arch:
    # Zero-based 9: audio output of the 10th AVT MM-DiT block, with the strict window active.
    repa_layer: 9
    repa_target_dim: 768
    repa_projector_dim: 2048

