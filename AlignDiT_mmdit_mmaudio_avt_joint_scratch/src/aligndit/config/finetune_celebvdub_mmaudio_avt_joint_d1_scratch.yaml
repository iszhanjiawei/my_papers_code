hydra:
  run:
    dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${datasets.name}_${model.tokenizer}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 666

datasets:
  name: CelebVDub
  data_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data
  # Keep the D1 frame budget for the formal experiment. The launcher permits
  # Hydra overrides for a smaller canary without changing this contract.
  batch_size_per_gpu: 9000
  batch_size_type: frame
  max_samples: 32
  num_workers: 16

optim:
  epochs: 200
  learning_rate: 5e-5
  num_warmup_updates: 20000
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: False

model:
  name: AlignDiT_MMAudioMMDiT_AVTJoint_D1_6J12A_DualCTC6_12_Scratch
  tokenizer: char
  tokenizer_path: null
  backbone: DiT_VT_MMAudio

  arch:
    dim: 768
    depth: 18
    heads: 12
    ff_mult: 2
    text_dim: 512
    # Joint Attention sees variable-length text directly. Masking inside the
    # character ConvNeXt prevents padded characters leaking into valid tokens.
    text_mask_padding: True
    qk_norm: rms_norm
    conv_layers: 4
    # Preserve D1 for the topology ablation; test all-head RoPE separately.
    pe_attn_head: 1
    attn_backend: torch
    attn_mask_enabled: True
    # Required for the 9000-frame budget on 24 GiB RTX 4090s; this is
    # mathematically identical and only recomputes activations in backward.
    checkpoint_activations: True
    use_conformer: True
    # Zero-based: CTC after the final AVT JointBlock and after audio block 12.
    layer_indices_ctc: [5, 11]
    n_mm_layers: 6
    audio_video_ratio: 4
    video_dim: 1024
    video_rope_scaled: True
    # MMAudio: temporal ConvMLP for A/V, token MLP for ordered text.
    av_ff_kernel_size: 3
    text_ff_kernel_size: 1
    text_input_ff_mult: 4
    # Block 5 lets V/T contribute K/V but updates only the audio state.
    last_joint_pre_only: True

  mel_spec:
    target_sample_rate: 16000
    n_mel_channels: 80
    hop_length: 160
    win_length: 640
    n_fft: 640
    mel_spec_type: hifigan_16k

  vocoder:
    is_local: True
    local_path: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/alignDiT_idea6/my_papers_code/hifigan_16k_LRS3/g_01000000

  ctc_lambda: 0.1

ema:
  beta: 0.999

ckpts:
  # This experiment must never initialize from the LibriSpeech audio model.
  # A restart may still resume its own model_last.pt from this unique save_dir.
  init_mode: scratch
  pretrained_path: null
  logger: tensorboard
  log_samples: False
  save_per_updates: 50000
  keep_last_n_checkpoints: -1
  last_per_updates: 5000
  save_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${datasets.name}_${model.tokenizer}
