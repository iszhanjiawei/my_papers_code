defaults:
  - finetune_celebvdub_mm_c2_semantic_vae_direct_speaker_ctc003_warmup
  - _self_

# Native frozen AV-HuBERT path coordinate, not a learned Gaussian predictor.
# All existing 40-Hz latent/video arrays remain untouched.
datasets:
  video_path_enabled: True
  native_video_root: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/CelebVDub/avhubert_video_feat

model:
  name: AlignDiT_MMDiT_c2_svae_speaker_visual_path_band_ctc003_warmup10k30k
  arch:
    temporal_band_enabled: True
    temporal_band_mode: visual_path
    temporal_band_audio_fps: 40.0
    temporal_band_video_fps: 40.0
    temporal_band_fixed_offset_seconds: 0.0
    temporal_band_fixed_sigma_seconds: 0.100
    # Dimensionless cumulative L2 distance on unit-normalized native features.
    # Initial engineering scale, not selected using test-set quality metrics.
    temporal_band_path_sigma: 2.0

ckpts:
  save_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/AlignDiT_MMDiT_c2_svae_speaker_visual_path_band_ctc003_warmup10k30k_40hz_CelebVDub_char
