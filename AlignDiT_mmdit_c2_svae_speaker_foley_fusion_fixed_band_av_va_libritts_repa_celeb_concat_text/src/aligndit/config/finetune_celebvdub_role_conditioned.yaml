defaults:
  - foley_fixed_band_libritts_repa
  - _self_

datasets:
  pairing_path: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/CelebVDub_role_pairs_v1/pairs.jsonl
  # Frame batching uses reference + target length. The underlying clips each
  # have at most 1199 frames; 2400 fits even the longest two-utterance pair.
  batch_size_per_gpu: 2400
  num_workers: 8

model:
  name: AlignDiT_foley_fixed_band_av_va_libritts_repa_wavlm_base_plus_celeb_role_conditioned_ctc003_warmup10k30k
  arch:
    checkpoint_activations: true

ckpts:
  save_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/${model.name}_40hz_CelebVDub_char
