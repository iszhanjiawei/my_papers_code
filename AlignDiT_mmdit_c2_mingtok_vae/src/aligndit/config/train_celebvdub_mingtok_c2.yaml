hydra:
  run:
    dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/${model.name}_${model.latent.name}_${datasets.name}_${model.tokenizer}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 666

datasets:
  name: CelebVDub
  data_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data
  cache_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/CelebVDub_mingtok_acoustic_64d_sample_seed666_fp32
  video_fps: 25
  batch_size_per_gpu: 4500
  batch_size_type: frame
  max_samples: 32
  num_workers: 16

optim:
  epochs: 200
  learning_rate: 5e-5
  num_warmup_updates: 20000
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: False

model:
  name: AlignDiT_MMDiT_qknorm_ca_c2_mingtok_64d50hz_scratch_ctc001_warmup10k30k_seed666
  tokenizer: char
  tokenizer_path: null
  backbone: DiT_VT_MMDiT

  arch:
    dim: 768
    depth: 18
    heads: 12
    ff_mult: 2
    text_dim: 512
    text_mask_padding: False
    qk_norm: rms_norm
    conv_layers: 4
    pe_attn_head: 1
    attn_mask_enabled: True
    checkpoint_activations: False
    use_conformer: True
    layer_indices_ctc: [6, 12]
    ctc_sampling_ratios: [1, 1]
    n_mm_layers: 12
    n_text_layers: 12
    prompt_isolated_ca: False
    audio_video_ratio: 2
    video_dim: 1024
    video_rope_scaled: True

  latent:
    name: mingtok_64d50hz
    dim: 64
    fps: 50

  codec:
    repo_path: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/alignDiT_idea6/MingTok-VAE/paper_code/MingTok-Audio
    checkpoint_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/alignDiT_idea6/MingTok-VAE/checkpoint/MingTok-Audio

  ctc_lambda: 0.01
  ctc_warmup_start: 10000
  ctc_warmup_end: 30000

ema:
  beta: 0.999

ckpts:
  logger: tensorboard
  log_samples: False
  save_per_updates: 50000
  keep_last_n_checkpoints: -1
  last_per_updates: 5000
  save_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/${model.name}_${model.latent.name}_${datasets.name}_${model.tokenizer}
