hydra:
  run:
    dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${datasets.name}_${model.tokenizer}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Explicitly seed model initialization and the dynamic batch sampler. The
# historical C2 run did not record a global seed, so future strict A/B controls
# must use this same value.
seed: 666

datasets:
  name: CelebVDub
  data_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data
  speaker_embedding_cache_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/CelebVDub/campplus_spk_emb_zh_en_16k
  speaker_embedding_dim: 192
  speaker_embedding_model_id: iic/speech_campplus_sv_zh_en_16k-common_advanced
  speaker_embedding_checkpoint_sha256: 92f29b94e6948786a26778c9e302525d185bb08c8b9f5252ed98776902840199
  batch_size_per_gpu: 9000
  batch_size_type: frame
  max_samples: 32
  num_workers: 16

optim:
  epochs: 200
  learning_rate: 5e-5
  num_warmup_updates: 20000
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: False

model:
  name: AlignDiT_MMDiT_qknorm_ca_c2_campplus_spk_tail6_finetune
  tokenizer: char
  tokenizer_path: null
  backbone: DiT_VT_MMDiT

  arch:
    dim: 768
    depth: 18
    heads: 12
    ff_mult: 2
    text_dim: 512
    text_mask_padding: False
    qk_norm: rms_norm
    conv_layers: 4
    pe_attn_head: 1
    attn_mask_enabled: True
    checkpoint_activations: False
    use_conformer: True
    layer_indices_ctc: [6, 12]
    n_mm_layers: 12
    n_text_layers: 12
    prompt_isolated_ca: False
    audio_video_ratio: 4
    video_dim: 1024
    video_rope_scaled: True
    # Frozen CAM++ emits 192-D vectors. A zero-initialized bias-free projection
    # adds them only to the timestep conditioning of audio-only blocks 12--17.
    speaker_dim: 192
    speaker_condition_start_layer: 12

  mel_spec:
    target_sample_rate: 16000
    n_mel_channels: 80
    hop_length: 160
    win_length: 640
    n_fft: 640
    mel_spec_type: hifigan_16k

  vocoder:
    is_local: True
    local_path: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/alignDiT_idea6/my_papers_code/hifigan_16k_LRS3/g_01000000

  ctc_lambda: 0.1

ema:
  beta: 0.999

ckpts:
  # Same parent and 200-epoch budget as non-VAE C2: speaker conditioning is
  # the only intended model/data variable.
  pretrained_path: ${oc.env:ROOT_PREFIX,''}/zjw524/datasets/AlignDiT_pretrain_LibriSpeech_500000.pt
  logger: tensorboard
  log_samples: True
  save_per_updates: 50000
  keep_last_n_checkpoints: -1
  last_per_updates: 5000
  save_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${datasets.name}_${model.tokenizer}
