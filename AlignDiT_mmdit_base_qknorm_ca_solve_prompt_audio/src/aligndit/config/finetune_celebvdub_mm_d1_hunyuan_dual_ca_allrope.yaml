defaults:
  - finetune_celebvdub_mm_d1_6mm12audio_dual_ctc6_12
  - _self_

# New identity: never resume or overwrite the historical D1 checkpoints.
model:
  name: AlignDiT_MMDiT_D1_HunyuanDualCA_AllRoPE_6MM12A_CTC6_12_finetune
  arch:
    text_attention_mode: hunyuan_dual
    # All heads in both AV joint attention and native audio-only attention.
    # Text CA uses its own all-head, ordinal Hunyuan RoPE independently.
    pe_attn_head: null
    # Recompute activations to retain D1's 9000-frame/GPU budget on 4090s.
    checkpoint_activations: True

ckpts:
  init_mode: audio_pretrained
  # Inherit the LibriSpeech 500k checkpoint and all optimizer/CTC settings.
  # Evaluation is run separately; do not hold a vocoder on rank 0 during training.
  log_samples: False
