defaults:
  - finetune_celebvdub_mm_c2_semantic_vae_direct
  - _self_

# Direct-C2 experiment with CTC disabled through 10k and linearly warmed to
# 0.03 at 30k. All other settings, including the global LR=5e-5, are inherited
# unchanged from the original Direct-C2 configuration.
model:
  name: AlignDiT_MMDiT_qknorm_ca_c2_semantic_vae_direct_c2_ctc003_warmup10k30k
  ctc_lambda: 0.03
  ctc_warmup_start: 10000
  ctc_warmup_end: 30000

ckpts:
  save_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/AlignDiT_MMDiT_qknorm_ca_c2_semantic_vae_direct_c2_ctc003_warmup10k30k_40hz_CelebVDub_char
