defaults:
  - pretrain_semantic_vae_warmstart_base
  - _self_

stage:
  name: s2c
  parent_checkpoint: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/AlignDiT_SemanticVAE_mel_warmstart_s2b_40hz_LibriSpeech/model_last.pt
  expected_parent_sha256: null
  expected_parent_update: 10000
  expected_parent_stage: s2b
  parent_contract_path: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/AlignDiT_SemanticVAE_mel_warmstart_s2b_40hz_LibriSpeech/training_contract.json

optim:
  # The scheduler is planned for 70k.  The launcher stops at 20k for the
  # cumulative-50k gate, then resumes the same contract to 70k if approved.
  max_updates: 70000
  num_warmup_updates: 1000
  learning_rates:
    interface: 2.0e-5
    projector: 2.0e-5
    early_backbone: 5.0e-6
    backbone: 1.0e-5

projection:
  target_lambda: 0.1
  ramp_updates: 5000

ckpts:
  save_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/AlignDiT_SemanticVAE_mel_warmstart_s2c_40hz_LibriSpeech
