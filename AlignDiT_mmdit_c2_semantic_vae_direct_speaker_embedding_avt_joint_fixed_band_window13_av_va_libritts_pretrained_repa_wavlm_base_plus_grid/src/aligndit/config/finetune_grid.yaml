defaults:
  - finetune_celebvdub_mm_c2_svae_speaker_avt_joint_fixed_band_window13_av_va_libritts_pretrained
  - _self_

# Keep the complete LibriTTS 50k EMA parent, vocabulary/normalization, fixed
# 13-frame AV+VA prior, 12 AVT MM blocks, six audio blocks and CAM++ conditioning.
# Add only the reference WavLM-Base+ REPA objective, reusing its audited cache.
datasets:
  name: GRID
  cache_root: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/GRID_svae1000k_sample_seed666_fp32
  manifest_path: ${datasets.cache_root}/manifests/train.jsonl
  # Resolve the authoritative completed GRID inventory before model creation.
  expected_manifest_sha256: null
  expected_inventory_sha256: null
  expected_record_count: null
  expected_vae_checkpoint_sha256: 7c455aa8ab3f7d576b4834f8342558894aafaa61a371b84a9bfa4d10a100e516
  expected_video_checkpoint_sha256: 343c9dbaa29847b8c4d0d9503c43f2877fd2efde9988d41abf14e74f28232b75
  speaker_embedding_cache_dir: ${datasets.cache_root}/speakers
  repa_feature_cache_dir: ${datasets.cache_root}/repa
  repa_feature_dim: 768
  repa_model_id: microsoft/wavlm-base-plus
  repa_model_revision: 4c66d4806a428f2e922ccfa1a962776e232d487b
  repa_checkpoint_sha256: 3bb273a6ace99408b50cfc81afdbb7ef2de02da2eab0234e18db608ce692fe51
  repa_teacher_layer: 12

optim:
  # Preserve the source experiment's LR trajectory; stop earlier at 150k.
  # LR decay still spans 1,000 epochs; 20k warmup and CTC 10k..30k stay fixed.
  epochs: 1000
  run_until_update: 150000

model:
  name: AlignDiT_MMDiT_c2_svae_speaker_avt_joint_fixed_band_window13_av_va_libritts_pretrained_repa_wavlm_base_plus_GRID_ctc003_warmup10k30k
  repa_lambda: 0.1
  arch:
    repa_layer: 9
    repa_target_dim: 768
    repa_projector_dim: 2048

ckpts:
  logger: tensorboard
  save_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/AlignDiT_MMDiT_c2_svae_speaker_avt_joint_fixed_band_window13_av_va_libritts_pretrained_repa_wavlm_base_plus_GRID_ctc003_warmup10k30k_40hz_char
