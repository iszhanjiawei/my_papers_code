defaults:
  - finetune_celebvdub_mm_c2_semantic_vae_direct_ctc003_warmup
  - _self_

# Record initialization as well as sampler seed for this new isolated run.
seed: 666

datasets:
  speaker_embedding_cache_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/CelebVDub/campplus_spk_emb_zh_en_16k
  speaker_embedding_dim: 192
  speaker_embedding_model_id: iic/speech_campplus_sv_zh_en_16k-common_advanced
  speaker_embedding_checkpoint_sha256: 92f29b94e6948786a26778c9e302525d185bb08c8b9f5252ed98776902840199

optim:
  # Stop after the comparison checkpoint without changing the inherited
  # 200-epoch learning-rate schedule.
  run_until_update: 200000

model:
  name: AlignDiT_MMDiT_c2_svae_speaker_pair_at_then_av_fixed_band_window13_av_va_libritts50k_ctc003_warmup10k30k
  arch:
    # Only the 12 MM blocks change topology; the 6 audio-only blocks are retained.
    text_joint_attention: True
    paired_joint_order: at_then_av
    # +/-6 aligned frames form the 13-frame core. The Gaussian has soft tails.
    temporal_band_enabled: true
    temporal_band_mode: fixed
    temporal_band_audio_fps: 40.0
    temporal_band_video_fps: 40.0
    temporal_band_fixed_offset_seconds: 0.0
    temporal_band_fixed_sigma_seconds: 0.150
    temporal_band_bidirectional: true
    n_text_layers: ${.n_mm_layers}
    speaker_dim: 192
    speaker_condition_start_layer: ${.n_mm_layers}

ckpts:
  initialization_mode: paired_libritts_text_audio
  pretrained_path: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/AlignDiT_LibriTTS_svae_speaker_pair_at_then_av_6AT6AV_50k/model_00050000.pt
  expected_parent_update: 50000
  expected_parent_sha256: null
  expected_parent_size: null
  expected_parent_contract_sha256: null
  parent_contract_path: null
  save_dir: ${oc.env:ROOT_PREFIX,''}/zjw524/projects/data/ckpts/${model.name}_40hz_CelebVDub_char
